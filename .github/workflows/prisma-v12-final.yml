name: PRISMA V12 FINAL validation

on:
  push:
    branches:
      - prisma-flow-v12-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate definitive embedded data and runtime package
        run: node validate_definitive.mjs
