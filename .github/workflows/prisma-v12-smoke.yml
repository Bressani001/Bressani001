name: PRISMA V12 Smoke

on:
  push:
    branches: [prisma-flow-v12-test]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check prisma-flow-v12-test/db.js
          node --check prisma-flow-v12-test/core.js
          node --check prisma-flow-v12-test/importer.js
          node --check prisma-flow-v12-test/map.js
          node --check prisma-flow-v12-test/app.js
      - name: Static smoke
        run: node prisma-flow-v12-test/smoke.mjs
