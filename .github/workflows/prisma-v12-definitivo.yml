name: PRISMA V12 Definitivo

on:
  push:
    branches:
      - prisma-flow-v12-definitivo
    paths:
      - 'prisma-flow-v12-test/**'
      - '.github/workflows/prisma-v12-definitivo.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  definitive-smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'prisma-flow-v12-test/MONTAR_PRISMA_DEFINITIVO.ps1',
            'prisma-flow-v12-test/PREPARAR_BASE.ps1'
          )
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "PowerShell syntax error in $f"
            }
          }

      - name: Create tiny fake operational base
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force 'prisma-flow-v12-test/FONTES' | Out-Null
          Set-Content 'prisma-flow-v12-test/FONTES/catalog.js' 'window.__PACK_CATALOG__="fake";' -Encoding utf8
          Set-Content 'prisma-flow-v12-test/FONTES/whatsapp.js' 'window.__PACK_WHATSAPP__="fake";' -Encoding utf8
          Set-Content 'prisma-flow-v12-test/FONTES/point_details.js' 'window.__PACK_POINT_DETAILS__="fake";' -Encoding utf8
          Set-Content 'prisma-flow-v12-test/FONTES/machine_details.js' 'window.__PACK_MACHINE_DETAILS__="fake";' -Encoding utf8
          Set-Content 'prisma-flow-v12-test/FONTES/router.js' 'window.__PACK_ROUTER__="fake";' -Encoding utf8

      - name: Run definitive assembler
        shell: pwsh
        working-directory: prisma-flow-v12-test
        run: |
          $env:CI = 'true'
          ./MONTAR_PRISMA_DEFINITIVO.ps1

      - name: Validate assembled folder
        shell: pwsh
        run: |
          $root = 'prisma-flow-v12-test/PRISMA_FLOW_V12_DEFINITIVO'
          $required = @(
            'index.html',
            'ABRIR_PRISMA.bat',
            'base_manifest.js',
            'vendor/leaflet.js',
            'vendor/leaflet.css',
            'vendor/xlsx.full.min.js',
            'BASE_PRISMA/ATUAL/catalog.js',
            'BASE_PRISMA/ATUAL/whatsapp.js'
          )
          foreach ($f in $required) {
            if (!(Test-Path (Join-Path $root $f))) { throw "Missing assembled file: $f" }
          }
          $index = Get-Content (Join-Path $root 'index.html') -Raw
          if ($index -match 'unpkg.com/leaflet|cdn.jsdelivr.net/npm/xlsx') { throw 'External runtime CDN still present' }
          if ($index -notmatch '12.3.0-DEFINITIVO-20261005') { throw 'Definitive build id missing' }
          $manifest = Get-Content (Join-Path $root 'base_manifest.js') -Raw
          if ($manifest -notmatch 'catalog.js' -or $manifest -notmatch 'whatsapp.js') { throw 'Manifest missing base files' }
          Write-Host 'PRISMA V12 DEFINITIVO smoke: OK'
