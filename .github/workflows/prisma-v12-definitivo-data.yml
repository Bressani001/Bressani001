name: PRISMA V12 Definitivo Data

on:
  push:
    branches:
      - prisma-flow-v12-definitivo
    paths:
      - 'prisma-flow-v12-test/**'
      - '.github/workflows/prisma-v12-definitivo-data.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate definitive embedded data
        run: node prisma-flow-v12-test/validate_definitive.mjs
