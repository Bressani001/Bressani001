<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>PRISMA FLOW V13 • NOC COMMAND CENTER</title>
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./v13.css">
</head>
<body>
  <div id="bootError" class="boot-error hidden"></div>
  <div class="shell v13-shell">
    <aside class="sidebar v13-sidebar" id="sidebar">
      <div class="brand v13-brand">
        <div class="prisma-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="img">
            <defs>
              <linearGradient id="pg1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#ffb22c"/>
                <stop offset=".55" stop-color="#ff6a00"/>
                <stop offset="1" stop-color="#ff3d00"/>
              </linearGradient>
              <linearGradient id="pg2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3a3a3f"/>
                <stop offset="1" stop-color="#090a0d"/>
              </linearGradient>
            </defs>
            <path d="M32 5 58 51 43 55 31 28 18 53 6 49Z" fill="url(#pg1)"/>
            <path d="M32 5 31 28 18 53 6 49Z" fill="url(#pg2)"/>
            <path d="M31 28 43 55 18 53Z" fill="#17181d" stroke="#ffb22c" stroke-width="1.2"/>
            <path d="M31 28 43 55" stroke="#fff4cf" stroke-width="1.3" opacity=".88"/>
          </svg>
        </div>
        <div class="brand-copy">
          <strong>PRISMA <b>FLOW</b></strong>
          <small>NOC COMMAND CENTER • V13</small>
        </div>
        <button id="sidebarToggle" class="sidebar-toggle" title="Recolher menu">‹</button>
      </div>

      <nav class="nav-stack">
        <div class="nav-section">TRABALHO</div>
        <button class="nav active" data-page="home"><span class="nav-ico">⌂</span><span>Visão geral</span></button>
        <button class="nav" data-page="search"><span class="nav-ico">⌕</span><span>Busca global</span></button>
        <button class="nav" data-page="map"><span class="nav-ico">⌖</span><span>Mapa</span></button>
        <button class="nav" data-page="today"><span class="nav-ico">✓</span><span>Meu Turno</span></button>
        <button class="nav" data-page="flow360"><span class="nav-ico">◎</span><span>Ponto 360º</span></button>

        <div class="nav-section">ACIONAMENTO</div>
        <button class="nav" data-page="router"><span class="nav-ico">↗</span><span>Roteador NOC</span></button>
        <button class="nav" data-page="pointgroup"><span class="nav-ico">⇢</span><span>Ponto → Grupo</span></button>
        <button class="nav" data-page="routes"><span class="nav-ico">⇄</span><span>Rotas WhatsApp</span></button>
        <button class="nav" data-page="messages"><span class="nav-ico">✎</span><span>Mensagens</span></button>
        <button class="nav" data-page="groups"><span class="nav-ico">◉</span><span>Grupos</span></button>

        <div class="nav-section">BASE</div>
        <button class="nav" data-page="imports"><span class="nav-ico">＋</span><span>Importar dados</span></button>
        <button class="nav" data-page="corrections"><span class="nav-ico">✦</span><span>Correções</span></button>

        <details class="nav-more">
          <summary>Mais ferramentas</summary>
          <div class="nav-more-body">
            <button class="nav" data-page="explore"><span class="nav-ico">▦</span><span>Explorar base</span></button>
            <button class="nav" data-page="relations"><span class="nav-ico">⌘</span><span>Relações</span></button>
            <button class="nav" data-page="operations"><span class="nav-ico">↗</span><span>Operações</span></button>
            <button class="nav" data-page="health"><span class="nav-ico">♥</span><span>Saúde das bases</span></button>
            <button class="nav" data-page="local"><span class="nav-ico">●</span><span>Dados locais</span></button>
            <button class="nav" data-page="backup"><span class="nav-ico">⇩</span><span>Backup</span></button>
            <button class="nav" data-page="sources"><span class="nav-ico">◫</span><span>Fontes</span></button>
          </div>
        </details>
      </nav>

      <div class="side-spacer"></div>
      <div class="sidebar-status">
        <span class="status-dot"></span>
        <div><b>Base embutida</b><small>95.520 pontos • 42.431 máquinas</small></div>
      </div>
    </aside>

    <main class="main v13-main">
      <header class="topbar v13-topbar">
        <div class="page-heading">
          <span class="page-eyebrow">PRISMA / NOC</span>
          <h1 id="pageTitle">Visão geral</h1>
          <p id="pageSub">Encontre, entenda e aja sem caçar informação.</p>
        </div>
        <div class="top-actions v13-top-actions">
          <div class="top-search v13-top-search">
            <span class="search-glyph">⌕</span>
            <input id="topQuickSearch" autocomplete="off" placeholder="Ponto, máquina, chamado, grupo, ativo, endereço…">
            <span class="kbd">Ctrl K</span>
            <button id="topQuickSearchBtn" class="search-submit">Buscar</button>
          </div>
          <button id="quickAddBtn" class="quick-add">＋</button>
          <span id="baseStatus" class="status-pill warn">Carregando base…</span>
          <button id="connectBtn" class="base-switch" title="Trocar base manualmente">Base</button>
          <input id="folderInput" type="file" webkitdirectory multiple hidden>
        </div>
      </header>

      <section id="page-home" class="page active"></section>
      <section id="page-search" class="page"></section>
      <section id="page-explore" class="page"></section>
      <section id="page-today" class="page"></section>
      <section id="page-flow360" class="page"></section>
      <section id="page-map" class="page"></section>
      <section id="page-pointgroup" class="page"></section>
      <section id="page-router" class="page"></section>
      <section id="page-routes" class="page"></section>
      <section id="page-groups" class="page"></section>
      <section id="page-messages" class="page"></section>
      <section id="page-relations" class="page"></section>
      <section id="page-imports" class="page"></section>
      <section id="page-corrections" class="page"></section>
      <section id="page-health" class="page"></section>
      <section id="page-operations" class="page"></section>
      <section id="page-local" class="page"></section>
      <section id="page-backup" class="page"></section>
      <section id="page-sources" class="page"></section>
    </main>
  </div>

  <div id="drawerBack" class="drawer-back hidden">
    <aside id="drawer" class="drawer"><button id="drawerClose" class="icon-btn">✕</button><div id="drawerBody"></div></aside>
  </div>
  <div id="modalBack" class="modal-back hidden"><div id="modal" class="modal"></div></div>
  <div id="toast" class="toast"></div>

  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./vendor/leaflet.js"></script>
  <script src="./db.js"></script>
  <script src="./legacy.js"></script>
  <script src="./core.js"></script>
  <script src="./auto_loader.js"></script>
  <script src="./importer.js"></script>
  <script src="./map.js"></script>
  <script src="./routes.js"></script>
  <script src="./groups.js"></script>
  <script src="./router_noc.js"></script>
  <script src="./messages.js"></script>
  <script src="./flow.js"></script>
  <script src="./explore.js"></script>
  <script src="./access.js"></script>
  <script src="./app.js"></script>
  <script src="./v13.js"></script>
</body>
</html>
